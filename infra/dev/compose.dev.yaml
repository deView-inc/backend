name: deView-api

services:
    api:
        hostname: api
        image: ghcr.io/deview-inc/backend:dev
        env_file:
            - .env
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            DATABASE_URL: postgres://${DB_USERNAME}:${DB_PASSWORD}@database:5432/${DB_DATABASE}
            DB_HOST: database
            DB_PORT: 5432
            REDIS_HOST: redis
            REDIS_PORT: 6379
            LIVEKIT_URL: ws://livekit:7880 # для бэкенда (EgressClient)
            LIVEKIT_PUBLIC_URL: ws://localhost:7880 # для клиента (wsUrl в ответе токена)
            S3_ENDPOINT: http://host.docker.internal:9000
        ports:
            - '3001:3001'
        depends_on:
            database:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - backend
        deploy:
            resources:
                limits:
                    cpus: '2.0'
                    memory: 1024M
                reservations:
                    cpus: '0.5'
                    memory: 256M

    database:
        hostname: database
        image: postgres:16-alpine
        restart: unless-stopped
        env_file:
            - .env
        environment:
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_DATABASE}
        ports:
            - '6000:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - backend
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -q || exit 1']
            interval: 5s
            timeout: 5s
            retries: 5
        profiles: ['infra']

    redis:
        hostname: redis
        image: redis:7-alpine
        restart: unless-stopped
        ports:
            - '${REDIS_PORT:-6999}:6379'
        command: redis-server --save 60 1 --loglevel notice
        volumes:
            - redis_data:/data
        networks:
            - backend
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 3
        profiles: ['infra']

    livekit:
        hostname: livekit
        image: livekit/livekit-server:latest
        restart: unless-stopped
        command: --config /etc/livekit.yaml
        environment:
            LIVEKIT_KEYS: '${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}'
        volumes:
            - ./livekit.yaml:/etc/livekit.yaml:ro
        ports:
            - '7880:7880'
            - '7881:7881'
            - '7882:7882/udp'
        depends_on:
            redis:
                condition: service_healthy
        networks:
            - backend
        profiles: ['infra']

    egress:
        hostname: egress
        image: livekit/egress:latest
        restart: unless-stopped
        cap_add:
            - SYS_ADMIN
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            EGRESS_CONFIG_BODY: |
                log_level: info
                api_key: ${LIVEKIT_API_KEY}
                api_secret: ${LIVEKIT_API_SECRET}
                ws_url: ws://livekit:7880
                redis:
                    address: redis:6379
                health_port: 8080
        depends_on:
            - livekit
        networks:
            - backend
        profiles: ['infra']

volumes:
    postgres_data:
    redis_data:

networks:
    backend:
        name: deView-gateway
